    <!-- The opening frame is the LCP: fetch it before the bundle asks for it.
         Built from frame 0 of the GOP-6 file the canvas actually plays — not
         the master — so the handover is between two identical images: measured
         mean luma 38 on both. At the source's own 16:9 aspect, so
         object-fit:cover frames it exactly like the canvas. AVIF because lossy
         WebP darkens this night scene by 1.3 luma, which would show as a flash
         at the poster→video handover. (The .webp beside it is for og:image,
         which social crawlers need and where the shift does not matter.)

         Desktop only, deliberately: the poster belongs to CanvasNarrative, and
         below 900px Journey renders SegmentPlayback instead, which never asks
         for it. A mobile preload here was 145 KB of pure waste on the phones
         that can least afford it. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/media/web/scene-01-poster-desktop.avif"
      media="(min-width: 900px)"
      fetchpriority="high"
    />
